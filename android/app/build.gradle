plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mapsrelay.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.mapsrelay.companion"
        // NotificationListenerService predates this, but GMapsParser uses
        // java.time, so 26 is the practical floor.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { debug { minifyEnabled false } }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.appcompat:appcompat:1.7.0"

    // Transport to the watch. Requires Garmin Connect Mobile installed.
    implementation "com.garmin.connectiq:ciq-companion-app-sdk:2.2.0@aar"

    // No notification-parsing library: GMapsParser inflates the notification's
    // RemoteViews, which fails on every notification on Android 14 because
    // Maps uses the standard template. MapsNotificationParser reads the
    // documented extras instead. See docs in that file.
}
