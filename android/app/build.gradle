plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mapsrelay.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.mapsrelay.companion"
        // Well below anything this app is actually run on; kept at 26 because
        // nothing needs it lower. (It was pinned here by GMapsParser's use of
        // java.time, which v0.8 removed.)
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "0.15"
    }

    // A stable signing key, so successive CI builds can update in place.
    // Gradle's default debug key is generated fresh on every clean runner, so
    // each build produced a different signature and Android refused the
    // upgrade with INSTALL_FAILED_UPDATE_INCOMPATIBLE - you had to uninstall
    // first, losing the notification-access grant each time.
    //
    // The keystore arrives from a repository secret; builds without it fall
    // back to the default debug key so a local or forked build still works.
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "mapsrelay"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    // Off by default from AGP 8. The vendored OsmAnd contract in src/main/aidl
    // is the whole reason this app can read turn data, so without this nothing
    // compiles.
    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.appcompat:appcompat:1.7.0"

    // Transport to the watch. Requires Garmin Connect Mobile installed.
    implementation "com.garmin.connectiq:ciq-companion-app-sdk:2.2.0@aar"

    // Turn data comes from OsmAnd over AIDL. The contract is vendored in
    // src/main/aidl rather than pulled from net.osmand:android-aidl-lib, which
    // is an unpinned snapshot on a third-party host; see src/main/aidl/README.md.
    // Nothing to declare here - AIDL is compiled from source.
}
