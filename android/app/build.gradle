plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mapsrelay.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.mapsrelay.companion"
        // NotificationListenerService predates this, but GMapsParser uses
        // java.time, so 26 is the practical floor.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { debug { minifyEnabled false } }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.appcompat:appcompat:1.7.0"

    // Transport to the watch. Requires Garmin Connect Mobile installed.
    implementation "com.garmin.connectiq:ciq-companion-app-sdk:2.2.0@aar"

    // Parses Google Maps' navigation notification. Deliberately not written
    // by hand: the notification format is undocumented and Google changes it,
    // so this is the one part worth delegating to something maintained.
    implementation "com.github.3v1n0.GMapsParser:navparser:0.2.1"
}
