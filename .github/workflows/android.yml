name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Without a stable key every build gets a different signature and
      # Android refuses to upgrade in place.
      # The `secrets` context is not available in a step-level `if`, so the
      # "do we have a key?" test lives inside the step instead.
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mapsrelay.jks"
            echo "signing key restored"
          else
            echo "no signing secret; falling back to the default debug key"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mapsrelay.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Stage APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk maps-relay.apk

      # A tag publishes a permanent, versioned release. Everything else
      # refreshes the rolling `apk` release, so the phone always has one
      # stable URL to fetch the latest build from.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" maps-relay.apk \
            --title "Maps Relay $TAG" \
            --notes-file RELEASE_NOTES.md \
            || gh release upload "$TAG" maps-relay.apk --clobber

      # Publishing used to require pushing a `v*` tag by hand, and a forgotten
      # tag left finished work sitting in the rolling `apk` release with no
      # version against it -- twice. The version in build.gradle is the single
      # source of truth now: bump it and the release publishes itself.
      - name: Publish release for versionName
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          if [ -z "$VER" ]; then
            echo "::warning::could not read versionName; skipping"
            exit 0
          fi
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released; leaving it alone"
            exit 0
          fi
          echo "publishing $TAG"
          gh release create "$TAG" maps-relay.apk \
            --target "$GITHUB_SHA" \
            --title "Maps Relay $TAG" \
            --notes-file RELEASE_NOTES.md

      # Update in place rather than delete-and-recreate. Deleting the release
      # leaves the tag behind for a moment, and `gh release create` then fails
      # with "a release with the same tag name already exists" -- which is
      # exactly what happened on the v0.9 build, after the APK had been built
      # successfully. Uploading over the existing asset has no such race, and
      # keeps the tag and its URL stable between builds.
      - name: Refresh rolling APK release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Debug build from ${GITHUB_SHA:0:7}. Download maps-relay.apk on your phone and open it."
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk maps-relay.apk --clobber
            # Cosmetic, and GitHub's releases API has been returning
            # intermittent 500/502s on it while the upload above succeeds.
            # Failing the build over the description would throw away a good
            # APK, so this one is allowed to fail.
            gh release edit apk --notes "$NOTES" \
              || echo "::warning::could not update release notes (APK uploaded fine)"
          else
            gh release create apk maps-relay.apk \
              --title "Maps Relay APK (latest)" \
              --notes "$NOTES"
          fi
