name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Without a stable key every build gets a different signature and
      # Android refuses to upgrade in place.
      - name: Restore signing key
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/mapsrelay.jks"

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mapsrelay.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Stage APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk maps-relay.apk

      # A tag publishes a permanent, versioned release. Everything else
      # refreshes the rolling `apk` release, so the phone always has one
      # stable URL to fetch the latest build from.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" maps-relay.apk \
            --title "Maps Relay $TAG" \
            --notes-file RELEASE_NOTES.md \
            || gh release upload "$TAG" maps-relay.apk --clobber

      - name: Refresh rolling APK release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk -y --cleanup-tag 2>/dev/null || true
          gh release create apk maps-relay.apk \
            --title "Maps Relay APK (latest)" \
            --notes "Debug build from ${GITHUB_SHA:0:7}. Download maps-relay.apk on your phone and open it."
