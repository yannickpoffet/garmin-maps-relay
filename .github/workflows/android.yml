name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk maps-relay.apk
          gh release delete apk -y --cleanup-tag 2>/dev/null || true
          gh release create apk maps-relay.apk \
            --title "Maps Relay APK" \
            --notes "Debug build from ${GITHUB_SHA:0:7}. Download maps-relay.apk on your phone and open it."
